<html>

<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      border: 1px solid #ccc;
      padding: 10px;
    }

    td:first-child {
      font-weight: bold;
      width: 50%;
    }
  </style>
</head>

<body>
  <h2>Survey Response</h2>
  <table>
    <tr>
      <td>Your Name:</td>
      <td>{{name}}</td>
    </tr>
    <tr>
      <td>Your Email:</td>
      <td>{{email}}</td>
    </tr>
    <tr>
      <td>Designation:</td>
      <td>{{designation}}</td>
    </tr>
    <tr>
      <td>Streamline Operation:</td>
      <td>{{streamlineOperation}}</td>
    </tr>
    <tr>
      <td>Stay Competitive:</td>
      <td>{{stayCompetitive}}</td>
    </tr>
  </table>
</body>

</html>
